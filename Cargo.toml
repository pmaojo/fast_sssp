[package]
name = "fast_sssp"
version = "0.1.0"
edition = "2021"
authors = ["Pelayo Maojo <pelayo.maojo@gmail.com>"]
description = "Implementation of O(m log^(2/3) n) single-source shortest path algorithm"
license = "MIT"
repository = "https://github.com/pmaojo/fast_sssp"

[lib]
name = "fast_sssp"
crate-type = ["lib", "cdylib"]

[dependencies]
num-traits = "0.2"    # For numeric traits
thiserror = "1.0"     # For better error handling
log = "0.4"           # For logging
ordered-float = "3.0" # For floating point numbers with Ord trait
rand = "0.8"          # For generating random graphs
libc = { version = "0.2", optional = true }
pyo3 = { version = "0.19", features = ["extension-module"], optional = true }

[dev-dependencies]
criterion = "0.4"     # For benchmarking
colored = "2.0"       # For colored terminal output
# Dependencies for examples (web_server, benchmarks)
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.10"

[features]
default = []
ffi = ["libc"]
python = ["pyo3", "ffi"]
